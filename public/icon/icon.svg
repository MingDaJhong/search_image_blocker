<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- 1 & 2 修正：微調遮罩線條起始點 (2,18) 與寬度 (14)，精準對齊紅線邊緣，解決底部凹凸問題 -->
    <mask id="mountainMask">
      <rect width="100%" height="100%" fill="white" />
      <line x1="2" y1="18" x2="122" y2="138" stroke="black" stroke-width="14" stroke-linecap="round" />
    </mask>
    <!-- 保持半徑 51，確保山脈底緣無縫貼合藍線 -->
    <clipPath id="mountainClip">
      <circle cx="58" cy="58" r="51" />
    </clipPath>
  </defs>

  <!-- 太陽 -->
  <circle cx="66" cy="34" r="12" fill="#FBBC04" />
  
  <!-- 山脈：3 修正：左峰座標調整為 (18, 47)，讓頂部更尖銳 -->
  <path d="M -20 140 L 18 47 L 55 71 L 86 42 L 140 140 Z" fill="#34A853" mask="url(#mountainMask)" clip-path="url(#mountainClip)" />

  <!-- 放大鏡 (藍色主體) -->
  <path d="M 25 18 A 52 52 0 0 1 95 95" stroke="#4285F4" stroke-width="6" stroke-linecap="round" />
  <path d="M 78 106 A 52 52 0 0 1 8 44" stroke="#4285F4" stroke-width="6" stroke-linecap="round" />
  <line x1="95" y1="95" x2="124" y2="124" stroke="#4285F4" stroke-width="6" stroke-linecap="round" />

  <!-- 紅色斜線 -->
  <line x1="18" y1="34" x2="82" y2="98" stroke="#EA4335" stroke-width="6" stroke-linecap="round" />
</svg>
