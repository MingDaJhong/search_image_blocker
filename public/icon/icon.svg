<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- 遮罩，用較粗的黑色線條在山脈上挖出留白間隙 -->
    <mask id="mountainMask">
      <rect width="100%" height="100%" fill="white" />
      <line x1="32" y1="45" x2="88" y2="101" stroke="black" stroke-width="11" stroke-linecap="round" />
    </mask>
    <!-- 剪切路徑，精準對齊放大鏡內框，確保放大的山脈不超出去 -->
    <clipPath id="mountainClip">
      <circle cx="63.5" cy="60.5" r="39.5" />
    </clipPath>
  </defs>

  <!-- 太陽 -->
  <circle cx="68" cy="42" r="10" fill="#FBBC04" />
  
  <!-- 山脈 (高度拉高、底部加寬，使其佔據更大面積) -->
  <path d="M 10 110 L 42 62 L 60 78 L 80 54 L 115 110 Z" fill="#34A853" mask="url(#mountainMask)" clip-path="url(#mountainClip)" />

  <!-- 放大鏡 -->
  <path d="M 34 31 A 42 42 0 0 1 93 90" stroke="#4285F4" stroke-width="5" stroke-linecap="round" />
  <path d="M 73 101 A 42 42 0 0 1 23 51" stroke="#4285F4" stroke-width="5" stroke-linecap="round" />
  <line x1="93" y1="90" x2="114" y2="111" stroke="#4285F4" stroke-width="5" stroke-linecap="round" />

  <!-- 紅色斜線 -->
  <line x1="32" y1="45" x2="88" y2="101" stroke="#EA4335" stroke-width="5" stroke-linecap="round" />
</svg>
